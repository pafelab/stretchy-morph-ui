<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stretchy UI starter</title>
<!-- Thai-capable variable font with a width axis (use font-stretch:70% for condensed display type) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wdth,wght@62.5..100,100..900&display=swap" rel="stylesheet">
<style>
/* Tokens: light by default, dark via the OS or data-theme. Replace the palette per brief
   (see the frontend-design skill); keep the variable names. */
:root{
  --bg:#EFEDFB; --surface:#FFFFFF; --ink:#1C1840; --muted:#5E5A7E; --line:#D9D5F0;
  --accent:#6B4EFF; --accent-2:#FF4F7B; --ok:#0FA597;
  --stage:#E2DCFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14112B; --surface:#1E1A3D; --ink:#EFECFF; --muted:#A8A3CF; --line:#332E5E;
    --accent:#8470FF; --accent-2:#FF6B91; --ok:#22BFAE; --stage:#262052; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14112B; --surface:#1E1A3D; --ink:#EFECFF; --muted:#A8A3CF; --line:#332E5E;
  --accent:#8470FF; --accent-2:#FF6B91; --ok:#22BFAE; --stage:#262052; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;font-size:17px;line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* Specimen layout: minmax(0,1fr) stops wide children (carousels) blowing out the column */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 32px;padding:48px 0}
.spec{display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:320px;border-radius:32px;padding:28px;background:var(--stage);display:grid;place-items:center;overflow:hidden}
/* A stage that holds full-width block content must reset place-items, or Chromium shrink-wraps it */
.stage.block{display:block;place-items:normal}
.spec>h3{font-size:22px;margin:20px 0 4px;line-height:1.4}
.spec>p{margin:0;color:var(--muted);max-width:52ch}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

/* Example: worm tab bar (segmented control) */
.seg{position:relative;display:inline-flex;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.seg-ind{position:absolute;left:0;top:4px;bottom:4px;border-radius:999px;background:var(--accent);pointer-events:none}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--muted);padding:6px 18px;border-radius:999px;cursor:pointer;transition:color .25s;white-space:nowrap}
.seg button.on{color:#fff}

/* Cut CSS motion too; the JS springs snap on their own */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="grid">
    <article class="spec">
      <div class="stage">
        <div class="seg" id="tabs" role="tablist" aria-label="ตัวอย่างแท็บ">
          <span class="seg-ind"></span>
          <button data-seg role="tab">ภาพรวม</button>
          <button data-seg role="tab">กิจกรรม</button>
          <button data-seg role="tab">ตั้งค่า</button>
        </div>
      </div>
      <h3>แถบแท็บแบบหนอน</h3>
      <p>ขอบด้านหน้าวิ่งนำ ขอบด้านหลังตามทีหลัง ตัวชี้จึงยืดระหว่างทาง</p>
    </article>

    <article class="spec">
      <div class="stage" id="yourStage"><!-- build the next component here --></div>
      <h3>ชิ้นถัดไป</h3>
      <p>เขียนประโยค morph ก่อน: เมื่อ… รูปร่าง A กลายเป็น B และยืดเพราะ…</p>
    </article>
  </div>
</main>

<script>
/* =====================================================================
   stretchy-core.js  —  spring engine + stretch helpers, no dependencies.
   Paste inline into a page (globals), or turn into a module by adding
   `export` in front of the declarations you need.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const RM = matchMedia('(prefers-reduced-motion: reduce)');

/* Global damping multiplier. 1.8 = soft, 1 = bouncy, 0.5 = very stretchy.
   Read on every tick, so changing it retunes animations already running. */
let bounce = 1;
function setBounce(x) { bounce = x; }

/* ---------------------------------------------------------------------
   Spring: damped oscillator, semi-implicit Euler, 8 substeps per frame.
   new Spring(x0, {k, c, eps, onUpdate(x, v), onRest()})
     .to(t, {k, c})  retarget, keeps velocity (interruptible)
     .set(x)         jump, no animation
     .drag(x, v)     follow a pointer, recording velocity
     .kick(v)        add an impulse (wobble feedback)
   x is in whatever unit you like (px, 0..1, degrees). Pick eps to match:
   0.05 for px springs that only draw, ~0.5 for px springs whose onRest
   triggers logic, 0.001 for 0..1 springs.
   --------------------------------------------------------------------- */
class Spring {
  constructor(x, o = {}) {
    this.x = x; this.v = 0; this.t = x;
    this.k = o.k ?? 220; this.c = o.c ?? 18; this.eps = o.eps ?? 0.05;
    this.cb = o.onUpdate || (() => {}); this.rest = o.onRest || null;
    this.raf = 0; this.tick = this.tick.bind(this);
  }
  to(t, o) {
    if (o) { if (o.k) this.k = o.k; if (o.c) this.c = o.c; }
    this.t = t;
    if (RM.matches) {             // reduced motion: snap, but still fire onRest
      cancelAnimationFrame(this.raf); this.raf = 0;
      this.x = t; this.v = 0; this.cb(t, 0); this.rest && this.rest(); return this;
    }
    if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(this.tick); }
    return this;
  }
  set(x) { cancelAnimationFrame(this.raf); this.raf = 0; this.x = this.t = x; this.v = 0; this.cb(x, 0); }
  drag(x, v) { cancelAnimationFrame(this.raf); this.raf = 0; this.x = this.t = x; this.v = v; this.cb(x, v); }
  kick(v) { if (RM.matches) return; this.v += v; this.to(this.t); }
  tick(now) {
    const dt = Math.max(0, Math.min((now - this.last) / 1000, 1 / 30)); this.last = now;
    const n = 8, h = dt / n, c = this.c * bounce;
    for (let i = 0; i < n; i++) {
      const a = -this.k * (this.x - this.t) - c * this.v;
      this.v += a * h; this.x += this.v * h;
    }
    if (Math.abs(this.v) < this.eps && Math.abs(this.x - this.t) < this.eps) {
      this.x = this.t; this.v = 0; this.raf = 0; this.cb(this.x, 0); this.rest && this.rest(); return;
    }
    this.cb(this.x, this.v);
    this.raf = requestAnimationFrame(this.tick);
  }
}

/* ---------------------------------------------------------------------
   edgePair: two springs for the two edges of something that travels
   between slots. The edge facing the direction of travel is stiff, the
   other soft, so the shape stretches on the way and contracts on arrival.
   draw(L, R) receives both edges (left/right or top/bottom).
   --------------------------------------------------------------------- */
function edgePair(draw, o = {}) {
  const fast = o.fast || { k: 420, c: 30 }, slow = o.slow || { k: 150, c: 18 };
  let L = 0, R = 0;
  const l = new Spring(0, { onUpdate: x => { L = x; draw(L, R); } });
  const r = new Spring(0, { onUpdate: x => { R = x; draw(L, R); } });
  return {
    set(a, b) { l.set(a); r.set(b); },
    to(a, b) {
      if (a >= l.t) { r.to(b, fast); l.to(a, slow); }   // moving right/down: R leads
      else { l.to(a, fast); r.to(b, slow); }            // moving left/up: L leads
    }
  };
}

/* ---------------------------------------------------------------------
   Resync registry: re-measure after fonts load and on resize.
   --------------------------------------------------------------------- */
const resyncs = [];
const onResync = f => resyncs.push(f);
const resyncAll = () => resyncs.forEach(f => f());
addEventListener('resize', resyncAll);
if (document.fonts) document.fonts.ready.then(resyncAll);

/* ---------------------------------------------------------------------
   makeSegmented: segmented control / tab bar with a worm indicator.
   Markup: <div class="seg"><span class="seg-ind"></span><button data-seg>…</button>…</div>
   The root must be position:relative; the indicator absolute, left:0.
   --------------------------------------------------------------------- */
function makeSegmented(root, { attr = 'aria-pressed', initial = 0, onChange } = {}) {
  const btns = $$('[data-seg]', root), ind = $('.seg-ind', root); let cur = -1, lit = -1, tgt = [0, 0];
  /* The selected look (.on, a light label) switches on only once the indicator covers the button:
     switched on at click, a light label would sit on the light track until the worm arrives. */
  const light = i => { lit = i; btns.forEach((b, j) => b.classList.toggle('on', j === i)); };
  const ep = edgePair((L, R) => {
    ind.style.transform = `translateX(${L}px)`; ind.style.width = Math.max(0, R - L) + 'px';
    if (lit !== cur && L <= tgt[0] + 2 && R >= tgt[1] - 2) light(cur);
  });
  const pos = i => [btns[i].offsetLeft, btns[i].offsetLeft + btns[i].offsetWidth];
  function select(i, anim = true, notify = true) {
    if (i === cur) return; cur = i;
    btns.forEach((b, j) => {
      b.setAttribute(attr, String(j === i));
      if (attr === 'aria-selected') b.tabIndex = j === i ? 0 : -1;
    });
    light(-1); tgt = pos(i);
    const [a, b] = tgt; anim ? ep.to(a, b) : ep.set(a, b);
    if (notify && onChange) onChange(i, btns[i]);
  }
  btns.forEach((b, i) => b.addEventListener('click', () => select(i)));
  root.addEventListener('keydown', e => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
    e.preventDefault(); const n = (cur + d + btns.length) % btns.length; select(n); btns[n].focus();
  });
  select(initial, false, false);
  onResync(() => { tgt = pos(cur); ep.set(tgt[0], tgt[1]); });
  return { select, get index() { return cur; } };
}

/* ---------------------------------------------------------------------
   makeAccordion: elastic accordion. The panel's height overshoots and
   settles (the hero), its content lags like something shaken in a box,
   the opened card drifts apart from its neighbours, the cards below
   squash a little as they are pushed, and the chevron flips with a pop.
   Works on two kinds of markup, items being direct children of root:
     <details>  <summary>…</summary> any content </details>   (enhanced in
       place: content is wrapped in .acc-panel > .acc-in; a `name` group
       becomes single mode, since the browser would close siblings with
       no animation)
     <div class="acc-item"> <button class="acc-btn" aria-controls>…</button>
       <div class="acc-panel"><div class="acc-in">…</div></div> </div>
   A chevron is any [data-acc-chev] or svg inside the header.
   Options: single (one open at a time; default true, or false for details
   without a name), initial (index or array), gap (px each opened card
   moves away from its neighbours, 0 = off), squash (pushed-card squash),
   onChange(openIndexes).
   --------------------------------------------------------------------- */
function makeAccordion(root, { single, initial = [], gap = 0, squash = true, onChange } = {}) {
  const items = $$(':scope > details, :scope > .acc-item', root);
  const isDet = items[0] && items[0].tagName === 'DETAILS';
  if (single === undefined) single = !isDet || items.some(d => d.hasAttribute('name'));
  const st = items.map((item, i) => {
    let header, panel, inner;
    if (item.tagName === 'DETAILS') {
      header = $(':scope > summary', item);
      if (item.hasAttribute('name')) { item.dataset.accName = item.getAttribute('name'); item.removeAttribute('name'); }
      panel = $(':scope > .acc-panel', item);
      if (!panel) {
        panel = document.createElement('div'); panel.className = 'acc-panel';
        inner = document.createElement('div'); inner.className = 'acc-in';
        [...item.childNodes].forEach(n => { if (n !== header) inner.appendChild(n); });
        panel.appendChild(inner); item.appendChild(panel);
      }
    } else {
      header = $('.acc-btn', item); panel = $('.acc-panel', item);
    }
    inner = inner || $('.acc-in', panel) || panel.firstElementChild;
    panel.style.overflow = 'hidden'; panel.style.height = '0px';
    inner.style.display = 'flow-root';                                   // flow-root: child margins count
    const chev = $('[data-acc-chev]', header) || $('svg', header);
    const s = { item, header, panel, inner, chev, open: false, det: item.tagName === 'DETAILS', expect: item.open };
    let rot = 0, pop = 0;
    const drawChev = () => { if (chev) chev.style.transform = `rotate(${rot}deg) scale(${1 + pop * .22},${1 - pop * .22})`; };
    s.h = new Spring(0, { k: 210, c: 14, eps: .5,
      onUpdate: (h, v) => {
        // A closing panel lands on a floor at 0 instead of ringing back open
        // (any global bounce can make the closing spring underdamped).
        if (!s.open && h <= 0 && v < 0) { s.h.x = 0; s.h.v = 0; h = v = 0; }
        panel.style.height = Math.max(0, h) + 'px';
        inner.style.transform = `translateY(${clamp(-v * .012, -10, 10)}px)`;
        if (squash) drawPush();
      },
      onRest: () => {                       // re-check: also fires after an open, or a close that was interrupted
        if (s.open) return;
        panel.style.height = '0px';
        if (s.det && item.open) detOpen(s, false);
      } });
    s.sep = new Spring(0, { k: 260, c: 18, eps: .001, onUpdate: x => {
      if (!gap) return;
      item.style.marginTop = i > 0 ? x * gap + 'px' : '';
      item.style.marginBottom = i < items.length - 1 ? x * gap + 'px' : '';
    } });
    s.rot = new Spring(0, { k: 300, c: 15, eps: .1, onUpdate: x => { rot = x; drawChev(); } });
    s.pop = new Spring(0, { k: 420, c: 14, eps: .001, onUpdate: x => { pop = x; drawChev(); } });
    panel.inert = true; if (!s.det) header.setAttribute('aria-expanded', 'false');
    return s;
  });

  /* Remember what we set, so the async toggle event can tell our changes from external ones. */
  function detOpen(s, v) { s.expect = v; s.item.open = v; }

  /* Pushed cards: each card below a moving panel squashes by the sum of the
     panels' height velocities above it (pushed down = flatter, pulled up = taller). */
  function drawPush() {
    let v = 0;
    st.forEach(s => {
      const y = clamp(v / 30000, -.04, .04);
      s.item.style.transformOrigin = '50% 0';
      s.item.style.transform = Math.abs(y) < .001 ? '' : `scale(${1 + y * .5},${1 - y})`;
      v += s.h.v;
    });
  }

  function setOpen(i, on, anim = true) {
    const s = st[i]; if (!s || s.open === on) return;
    s.open = on;                                                   // state first: under reduced motion
    s.item.classList.toggle('open', on);                           // to() calls onRest synchronously
    if (!s.det) s.header.setAttribute('aria-expanded', String(on));
    s.panel.inert = !on;
    if (on) {
      if (s.det && !s.item.open) detOpen(s, true);                 // render the content before measuring
      const H = s.inner.offsetHeight;
      anim ? s.h.to(H, { k: 210, c: 14 }) : s.h.set(H);            // underdamped: visible overshoot
    } else {
      anim ? s.h.to(0, { k: 260, c: 30 }) : (s.h.set(0), s.h.rest());  // ζ≈.93: no ringing back open at bounce .5
    }
    anim ? s.sep.to(on ? 1 : 0) : s.sep.set(on ? 1 : 0);
    anim ? s.rot.to(on ? 180 : 0) : s.rot.set(on ? 180 : 0);
    if (anim) s.pop.kick(on ? 7 : -5);
  }
  const openIndexes = () => st.map((s, i) => s.open ? i : -1).filter(i => i >= 0);
  function toggle(i, on = !st[i].open, anim = true) {
    if (on && single) st.forEach((s, j) => j !== i && setOpen(j, false, anim));
    setOpen(i, on, anim);
    onChange && onChange(openIndexes());
  }

  st.forEach((s, i) => {
    s.header.addEventListener('click', e => { e.preventDefault(); toggle(i); });
    if (s.det) s.item.addEventListener('toggle', () => {        // find-in-page, #hash, other scripts
      if (s.item.open === s.expect) return;                      // our own change, possibly already superseded
      s.expect = s.item.open; toggle(i, s.item.open, s.item.open);
    });
  });
  root.addEventListener('keydown', e => {
    const i = st.findIndex(s => s.header === e.target); if (i < 0) return;
    const n = st.length, to = { ArrowDown: (i + 1) % n, ArrowUp: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault(); st[to].header.focus();
  });

  /* Re-measure open panels when their content or width changes. */
  const remeasure = () => st.forEach(s => {
    if (!s.open) return;
    const H = s.inner.offsetHeight; if (Math.abs(H - s.h.t) < 1) return;
    s.h.raf ? s.h.to(H) : s.h.set(H);
  });
  if (window.ResizeObserver) { const ro = new ResizeObserver(remeasure); st.forEach(s => ro.observe(s.inner)); }
  onResync(remeasure);

  const init = new Set([].concat(initial));
  st.forEach((s, i) => { if (init.has(i) || (s.det && s.item.open)) { if (s.det) detOpen(s, false); init.add(i); } });
  [...init].slice(0, single ? 1 : undefined).forEach(i => setOpen(i, true, false));

  return {
    open: i => toggle(i, true), close: i => toggle(i, false), toggle: i => toggle(i),
    get openIndexes() { return openIndexes(); },
    get single() { return single; },
    set single(x) { single = x; if (x) openIndexes().slice(1).forEach(i => setOpen(i, false)); }
  };
}

/* ---------------------------------------------------------------------
   Deformation helpers
   --------------------------------------------------------------------- */

/* Volume preservation: when width changes with velocity v (px/s), return a
   scale for the other axis. Keep lo/hi tight (≈0.93..1.07) for controls. */
const volumeScale = (v, k = 9000, lo = 0.93, hi = 1.07) => clamp(1 - v / k, lo, hi);

/* Stretch along a direction of travel. Returns a transform fragment that
   lengthens along (vx, vy) and thins across it while keeping content upright. */
function alongVelocity(vx, vy, { max = 0.35, div = 3400, thin = 0.45 } = {}) {
  const sp = Math.hypot(vx, vy); if (sp < 40) return '';
  const a = Math.atan2(vy, vx) * 180 / Math.PI, s = Math.min(max, sp / div);
  return `rotate(${a}deg) scale(${1 + s},${1 - s * thin}) rotate(${-a}deg)`;
}

/* Bulging edges for big moving surfaces (draw the surface as an SVG path).
   b = edgeBulge(v): the middle lags behind the direction of motion. */
const edgeBulge = (v, k = 0.05, max = 56) => clamp(-v * k, -max, max);
/* Surface anchored left, moving right edge (sidebar). */
const rightEdgePath = (w, h, b) => `M0 0H${w}Q${w + b} ${h / 2} ${w} ${h}H0Z`;
/* Surface anchored bottom, moving top edge with rounded corners (sheet).
   `extra` extends below so an upward overshoot never shows a gap. */
const topEdgePath = (w, h, r, b, extra = 60) =>
  `M0 ${r}Q0 0 ${r} 0Q${w / 2} ${b} ${w - r} 0Q${w} 0 ${w} ${r}V${h + extra}H0Z`;

/* ---------------------------------------------------------------------
   flipReorder: animate a list reorder with springs that keep velocity,
   stretching items vertically while they move.
   els: the items; mutate(): reorders the DOM.
   --------------------------------------------------------------------- */
function flipReorder(els, mutate) {
  const first = new Map(els.map(e => [e, e.getBoundingClientRect().top]));
  mutate();
  els.forEach(e => {
    if (!e._flip) e._flip = new Spring(0, { k: 230, c: 20, onUpdate: (y, v) => {
      e.style.transform = `translateY(${y}px) scale(${1 - Math.min(.05, Math.abs(v) / 14000)},${1 + Math.min(.14, Math.abs(v) / 5000)})`;
    } });
    const d = first.get(e) - e.getBoundingClientRect().top;
    e._flip.drag(e._flip.x + d, e._flip.v); e._flip.to(0);
  });
}

/* ---------------------------------------------------------------------
   throwTo: lift a clone of `fromEl` off the page, shrink it into a round
   chip and throw it along an arc into `toEl` (add-to-cart, save-to-folder,
   send-to-inbox…). Time-based so the arc is predictable; stretch comes from
   the frame-to-frame velocity. `container` must be position:relative and
   contain both elements.
   --------------------------------------------------------------------- */
function throwTo({ container, fromEl, toEl, background = 'transparent', duration = 800,
                   arc = 90, endSize = 30, startRadius = 20, pad = 20, onArrive = () => {} }) {
  if (RM.matches) { onArrive(); return; }
  const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const sr = container.getBoundingClientRect(), a = fromEl.getBoundingClientRect(), c = toEl.getBoundingClientRect();
  const x0 = a.left + a.width / 2 - sr.left, y0 = a.top + a.height / 2 - sr.top;
  const x1 = c.left + c.width / 2 - sr.left, y1 = c.top + c.height / 2 - sr.top;
  const w0 = a.width + pad, h0 = a.height + pad;
  const cx = x0 + (x1 - x0) * .35, cy = Math.min(y0, y1) - arc, t0 = performance.now();
  const el = document.createElement('div');
  Object.assign(el.style, {
    position: 'absolute', left: 0, top: 0, zIndex: 5, display: 'grid', placeItems: 'center',
    overflow: 'hidden', pointerEvents: 'none', background, borderRadius: startRadius + 'px',
    boxShadow: '0 16px 30px -12px rgba(20,10,60,.5)', transition: 'opacity .16s'
  });
  const clone = fromEl.cloneNode(true); clone.removeAttribute('style'); clone.removeAttribute('id');
  Object.assign(clone.style, { width: '84%', height: '84%' });
  el.appendChild(clone); container.appendChild(el);
  let px = x0, py = y0, pt = t0, st = 0, ang = 0;
  (function frame(now) {
    const t = clamp((now - t0) / duration, 0, 1);
    const lift = Math.sin(clamp(t / .14, 0, 1) * Math.PI / 2) * (1 - clamp((t - .14) / .3, 0, 1));
    const u = easeIO(clamp((t - .1) / .9, 0, 1)), s = easeOut(clamp((t - .08) / .72, 0, 1));
    const bx = (1 - u) * (1 - u) * x0 + 2 * u * (1 - u) * cx + u * u * x1;
    const by = (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * cy + u * u * y1 - lift * 12;
    const dt = Math.max(1, now - pt), vx = (bx - px) / dt * 1000, vy = (by - py) / dt * 1000;
    px = bx; py = by; pt = now;
    const sp = Math.hypot(vx, vy);
    st = st * .7 + Math.min(.34, sp / 3400) * .3; if (sp > 40) ang = Math.atan2(vy, vx) * 180 / Math.PI;
    const sc = 1 + lift * .08;
    el.style.width = lerp(w0, endSize, s) + 'px'; el.style.height = lerp(h0, endSize, s) + 'px';
    el.style.borderRadius = lerp(startRadius, endSize / 2, s) + 'px';
    el.style.transform = `translate(${bx}px,${by}px) translate(-50%,-50%) rotate(${ang}deg) scale(${(1 + st) * sc},${(1 - st * .45) * sc}) rotate(${-ang}deg)`;
    if (t < 1) requestAnimationFrame(frame);
    else { el.style.opacity = 0; el.style.transform += ' scale(.4)'; setTimeout(() => el.remove(), 180); onArrive(); }
  })(t0);
}

/* Restart a CSS keyframe animation (e.g. a ring pulse on arrival). */
function replayClass(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }


/* ---------- tabs ---------- */
makeSegmented($('#tabs'), { attr: 'aria-selected' });
